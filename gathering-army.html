<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <script defer type="module" src="./js/gathering-army.js"></script>
    <title>Gathering Army</title>
  </head>
  <body>
    <header class="header">
      <nav class="header__nav">
        <a id="header__logo" href="#">Armies of Zondor</a>
        <ul class="nav__list">
          <li>
            <a id="header__nav-link" href="./getting-resources.html"
              >Get resources</a
            >
          </li>
          <li>
            <a id="header__nav-link" href="./your-army.html">Your army</a>
          </li>
        </ul>
      </nav>
    </header>

    <div id="search-container">
      <input placeholder="search.." type="text" name="" id="search-filter" />
    </div>

    <div class="icon-bar">
      <div class="icon">
        <img id="icon-image" src="./assets/gold-coin.png" alt="coin" />
        <p id="gold-count">0</p>
      </div>
      <div class="icon">
        <img id="icon-image" src="./assets/metal.png" alt="metal" />
        <p id="metal-count">0</p>
      </div>
      <div class="icon">
        <img id="icon-image" src="./assets/wood.png" alt="" />
        <p id="wood-count">0</p>
      </div>
    </div>

    <section id="search-result"></section>

    <section id="warrior-container">
      <!-- generated in js -->
    </section>
  </body>
</html>
